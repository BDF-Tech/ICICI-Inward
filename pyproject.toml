[project]
name = "icici_collection"
authors = [
    { name = "Erpdata", email = "contact@erpdata.in" }
]
description = "Get response and set payment entry"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
    "qrcode[pil]",
    "bs4",
    "pycryptodome",
    "wheel",
    "pandas",
    "openpyxl"
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"
